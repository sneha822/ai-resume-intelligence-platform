name: keep-warm

# Pings the free Render services so they don't sleep (and cold-start ~40s) between visits.
# Note: GitHub scheduled workflows are best-effort (can be delayed, and are disabled on
# repos with no activity for 60 days). For a rock-solid pinger, also use a free external
# uptime monitor (e.g. UptimeRobot / cron-job.org) hitting the /health URL every 5 min.

on:
  schedule:
    - cron: "*/13 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API and frontend
        run: |
          curl -fsS --max-time 90 https://airi-api-fxk7.onrender.com/health || true
          curl -fsS --max-time 90 https://airi-frontend-fxk7.onrender.com/ || true
