# Render Blueprint — FREE deploy of API + Streamlit frontend from this repo.
# Uses synchronous ingestion (INGEST_MODE=sync) so NO Celery worker and NO Redis
# are needed — both Render web services run on the free plan.
# Data lives on Neon (Postgres+pgvector). Secrets (sync: false) are set in the dashboard.
# Docs: docs/deploy-render.md
#
# Want the async worker instead? See the commented block at the bottom.

services:
  # ---- API (FastAPI) --------------------------------------------------------
  - type: web
    name: airi-api
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    plan: free
    healthCheckPath: /health
    dockerCommand: sh -c "python -m alembic upgrade head && uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - fromGroup: airi-secrets
      - key: DEBUG
        value: "false"
      - key: INGEST_MODE
        value: sync

  # ---- Frontend (Streamlit) -------------------------------------------------
  - type: web
    name: airi-frontend
    runtime: docker
    dockerfilePath: ./Dockerfile.frontend
    dockerContext: .
    plan: free
    dockerCommand: sh -c "streamlit run frontend/Home.py --server.port $PORT --server.address 0.0.0.0 --server.headless true --browser.gatherUsageStats false"
    envVars:
      # Set to the API's URL after first deploy (e.g. https://airi-api.onrender.com)
      - key: AIRI_API_URL
        sync: false

envVarGroups:
  - name: airi-secrets
    envVars:
      # Non-secret defaults:
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: EMBEDDING_MODEL
        value: BAAI/bge-base-en-v1.5
      - key: EMBEDDING_DIM
        value: "768"
      # Secrets — set these in the Render dashboard (never committed):
      - key: DATABASE_URL          # postgresql+psycopg://...neon...?sslmode=require&channel_binding=disable
        sync: false
      - key: GEMINI_API_KEY        # your Gemini key
        sync: false

# ---------------------------------------------------------------------------
# OPTIONAL: async worker (needs Redis + a PAID Render worker plan). To use it,
# set INGEST_MODE=async on the API, add REDIS_URL / CELERY_BROKER_URL /
# CELERY_RESULT_BACKEND to airi-secrets, and add this service:
#
#   - type: worker
#     name: airi-worker
#     runtime: docker
#     dockerfilePath: ./Dockerfile.backend
#     dockerContext: .
#     plan: starter
#     dockerCommand: celery -A backend.workers.celery_app worker --loglevel=info --concurrency=2
#     envVars:
#       - fromGroup: airi-secrets
# ---------------------------------------------------------------------------
