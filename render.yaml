# Render Blueprint — deploys API + Celery worker + Streamlit frontend from this repo.
# Secrets (sync: false) are set once in the Render dashboard, not in git.
# Docs: https://render.com/docs/blueprint-spec

services:
  # ---- API (FastAPI) --------------------------------------------------------
  - type: web
    name: airi-api
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    plan: free
    healthCheckPath: /health
    # Run DB migrations (idempotent) then serve on Render's $PORT.
    dockerCommand: sh -c "python -m alembic upgrade head && uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - fromGroup: airi-secrets
      - key: DEBUG
        value: "false"

  # ---- Celery worker (async ingestion / batch) ------------------------------
  # NOTE: Render background workers require a paid instance (no free plan).
  - type: worker
    name: airi-worker
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    plan: starter
    dockerCommand: celery -A backend.workers.celery_app worker --loglevel=info --concurrency=2
    envVars:
      - fromGroup: airi-secrets

  # ---- Frontend (Streamlit) -------------------------------------------------
  - type: web
    name: airi-frontend
    runtime: docker
    dockerfilePath: ./Dockerfile.frontend
    dockerContext: .
    plan: free
    dockerCommand: sh -c "streamlit run frontend/Home.py --server.port $PORT --server.address 0.0.0.0 --server.headless true --browser.gatherUsageStats false"
    envVars:
      # Set this to the API's URL after first deploy (e.g. https://airi-api.onrender.com)
      - key: AIRI_API_URL
        sync: false

# Shared, dashboard-managed configuration + secrets.
envVarGroups:
  - name: airi-secrets
    envVars:
      # Non-secret defaults (safe to keep in git):
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: EMBEDDING_MODEL
        value: BAAI/bge-base-en-v1.5
      - key: EMBEDDING_DIM
        value: "768"
      # Secrets — set these in the Render dashboard (never committed):
      - key: DATABASE_URL          # postgresql+psycopg://...neon...?sslmode=require&channel_binding=disable
        sync: false
      - key: REDIS_URL             # rediss://...upstash...:6379/0?ssl_cert_reqs=required
        sync: false
      - key: CELERY_BROKER_URL     # same rediss URL
        sync: false
      - key: CELERY_RESULT_BACKEND # same rediss URL
        sync: false
      - key: GEMINI_API_KEY        # your Gemini key
        sync: false
