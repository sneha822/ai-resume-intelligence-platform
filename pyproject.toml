[project]
name = "ai-resume-intelligence-platform"
version = "3.0.0"
description = "Enterprise AI Resume Intelligence & Interview Copilot"
requires-python = ">=3.10"
readme = "README.md"

dependencies = [
    # --- API ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    # --- Config / validation ---
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.5.0",
    # --- Structured LLM output ---
    "anthropic>=0.39.0",
    "instructor>=1.6.0",
    "tenacity>=9.0.0",
    # --- Persistence (Postgres + pgvector) ---
    "sqlalchemy[asyncio]>=2.0.35",
    "greenlet>=3.1.0",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.0",
    # --- Async workers ---
    "celery>=5.4.0",
    "redis>=5.1.0",
    # --- HTTP client (frontend -> api) ---
    "httpx>=0.27.0",
    # --- Retrieval: embeddings (ONNX, no torch), parsing, sparse BM25 ---
    "fastembed>=0.4.0",
    "pymupdf>=1.24.0",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7.0",
    "black>=24.10.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "aiosqlite>=0.20.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]

# ---------------------------------------------------------------------------
# Ruff (lint)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["legacy", "myenv", "notebooks", "screenshots", "static", "templates"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "ASYNC"]
ignore = ["E501"]  # line length handled by black

# ---------------------------------------------------------------------------
# Black (format)
# ---------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py310"]
extend-exclude = "(legacy|myenv|notebooks)"

# ---------------------------------------------------------------------------
# Mypy (type check) — strict on the new backend only
# ---------------------------------------------------------------------------
[tool.mypy]
# 3.12 so mypy can parse numpy 2.x's PEP 695 `type` stubs. Runtime target stays
# 3.10 (requires-python, CI matrix); our code avoids 3.12-only syntax by convention.
python_version = "3.12"
files = ["backend"]
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "pgvector.*",
    "instructor.*",
    "celery.*",
    "alembic.*",
    "rank_bm25.*",
]
ignore_missing_imports = true

# We don't type against these heavy libs directly; skip-follow keeps analysis
# fast and avoids surfacing their internal typing quirks.
[[tool.mypy.overrides]]
module = ["fastembed.*", "pymupdf.*", "numpy", "numpy.*"]
follow_imports = "skip"
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
# Only the new suite is collected by default; legacy/ is archived reference code.
# It stays runnable on demand, e.g. `pytest legacy/ -p no:cacheprovider`.
testpaths = ["tests"]
norecursedirs = ["legacy", "myenv", ".verifyenv", "notebooks", "__pycache__"]
addopts = "-ra --ignore=legacy --cov=backend --cov-report=term-missing"
asyncio_mode = "auto"
