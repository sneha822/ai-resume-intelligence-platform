[project]
name = "ai-resume-intelligence-platform"
version = "3.0.0"
description = "Enterprise AI Resume Intelligence & Interview Copilot"
requires-python = ">=3.10"
readme = "README.md"

dependencies = [
    # --- API ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    # --- Config / validation ---
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    # --- Structured LLM output ---
    "anthropic>=0.39.0",
    "instructor>=1.6.0",
    "tenacity>=9.0.0",
    # --- Persistence (Postgres + pgvector) ---
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.0",
    # --- Async workers ---
    "celery>=5.4.0",
    "redis>=5.1.0",
    # --- HTTP client (frontend -> api) ---
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7.0",
    "black>=24.10.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]

# ---------------------------------------------------------------------------
# Ruff (lint)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["archive", "src", "app", "myenv", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "ASYNC"]
ignore = ["E501"]  # line length handled by black

# ---------------------------------------------------------------------------
# Black (format)
# ---------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py310"]
extend-exclude = "(archive|src|app|myenv|notebooks)"

# ---------------------------------------------------------------------------
# Mypy (type check) — strict on the new backend only
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
files = ["backend"]
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["pgvector.*", "instructor.*", "celery.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --cov=backend --cov-report=term-missing"
